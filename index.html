<style>

   BASE
============================================================ */
body {
  font-family: 'Montserrat', sans-serif;
  background-color: #f9f9f9;
  padding: 40px 0;
}

/* ============================================================
   PANTALLA DE LOGIN
============================================================ */

  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #f9f9f9;
  padding: 20px;
}

.login-card {
  background: #fff;
  border-radius: 16px;

  padding: 48px 40px;
  max-width: 420px;
  width: 100%;

}

.login-logo {
  max-width: 160px;
  margin-bottom: 28px;
}

.login-card h1 {

/* Botón Google personalizado */

}

}
.google-btn img {
  width: 22px;
}

.login-footer {
  font-size: 12px;
  color: #aaa;
  margin-top: 20px;
}

/* Error de dominio */
.domain-error {
  display: none;
  margin-top: 14px;
  padding: 12px;
  background: #fff0f2;
  border: 1px solid #fcc;

}

/* ============================================================
   HEADER DE SESIÓN (aparece sobre el form)
============================================================ */
#sessionBar {
  display: none;
  max-width: 650px;
  margin: 0 auto 10px;
  padding: 10px 16px;
  background: #fff;
  border-radius: 8px;

  display: none;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
}
#sessionBar .user-info {

  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: #333;
}
#sessionBar img {
  width: 32px;
  border-radius: 50%;
}
#logoutBtn {
  background: none;
  border: 1px solid #fa345e;
  color: #fa345e;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  margin-top: 0;
}
#logoutBtn:hover { background: #fff0f2; }

/* ============================================================
   FORMULARIO (tu CSS original)
============================================================ */
#appScreen { display: none; }

.container {
  max-width: 650px;
  background: #fff;
  margin: auto;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(0,0,0,.1);
}
.logo {
  display: block;
  margin: 0 auto 20px;
  max-width: 180px;
}
h1 { color: #fa345e; text-align: center; margin-bottom: 30px; }
label { display: block; margin: 16px 0 6px; font-weight: 600; }
input, select, textarea {
  width: 100%; padding: 10px;
  border: 1px solid #ccc; border-radius: 8px; font-size: 14px;
}
select { background-color: #fef2f3; }
textarea { resize: vertical; min-height: 80px; }
button {
  background-color: #fa345e; color: white; border: none;
  padding: 12px 20px; border-radius: 8px; font-size: 16px;
  cursor: pointer; margin-top: 20px;
}
.gift-card-group {
  border: 1px solid #eee; padding: 20px;

}
.add-button { background-color: #f8848f; width: 100%; }
.warning {

  background: #fff3cd; border: 1px solid #ffeeba;
  color: #856404; border-radius: 6px; font-size: 13px; display: none;
}
.comentario-warning {
  margin-top: 8px; padding: 10px;
  background: #e8f4ff; border: 1px solid #b6e0fe;
  color: #084298; border-radius: 6px; font-size: 13px;
}
.hidden { display: none; }
.inline-row { display: flex; gap: 10px; align-items: flex-end; }
.inline-row > div { flex: 1; }
.small-btn { margin-top: 0; padding: 10px 14px; font-size: 14px; white-space: nowrap; }
.hr { margin: 22px 0; border: none; border-top: 1px solid #eee; }
.top-options { display: flex; gap: 20px; margin-bottom: 30px; }
.option-group { flex: 1; }
.toggle-group { display: flex; gap: 10px; }
.toggle-btn {
  flex: 1; padding: 10px; border-radius: 8px;
  border: 1px solid #fa345e; background: white;
  color: #fa345e; cursor: pointer; font-weight: 600; transition: 0.2s ease;
}
.toggle-btn.active {
  background: #fa345e !important; color: white !important; border: 1px solid #fa345e !important;
}
.delete-btn {
  background-color: #dc3545; color: white; border: none;
  padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 10px;
}
.delete-btn:hover { background-color: #b02a37; }
</style>
</head>

<body>

<!-- ============================================================
     PANTALLA LOGIN
============================================================ -->
<div id="loginScreen">

    <h1>Pedido Gift Cards</h1>

<!-- ============================================================

<div id="sessionBar">

  </div>
  <button id="logoutBtn" onclick="cerrarSesion()">Cerrar sesión</button>
</div>

<!-- ============================================================
     FORMULARIO (tu form original intacto)
============================================================ -->
<div id="appScreen">
<div class="container">
  <img src="https://estudios.apprecio.com/hubfs/logos/Apprecio-logo-rojo.png" class="logo" />
  <h1>Pedido Gift Cards</h1>

  <form method="POST" enctype="multipart/form-data"
        action="https://n8n.openip.cl/webhook/pedidosgc">

    <input type="hidden" name="idPanel" id="idPanelHidden">
    <input type="hidden" name="nombreSucursal" id="nombreSucursalHidden">

    <div class="top-options">

          <button type="button" class="toggle-btn" data-value="Facturacion">Facturación</button>

      </div>
      <div class="option-group">

    <label>Panel Empresa</label>
    <select id="panelEmpresa" name="panel" required>
      <option value="">Selecciona empresa</option>

    <select name="tipoPago" required>
      <option value="">Selecciona</option>
      <option>Crédito (LC)</option>

    <input name="oc" required />

    <label>Requiere HES</label>
    <select name="HES" required>
      <option value="No" selected>No</option>
      <option value="Si">Si</option>

      <option value="">Selecciona</option>
      <option value="PDF">Gift card PDF</option>

    <div id="giftCardFields"></div>

    <button type="button" class="add-button" onclick="addGiftCardGroup()">
      ➕ Agregar Gift Card manual
    </button>

    <label>Adjuntar archivos</label>
    <input type="file" name="adjunto[]" multiple required />

    <button type="submit">Enviar pedido</button>
  </form>
</div>
</div>

<!-- ============================================================
     SCRIPTS
============================================================ -->
<script>
/* ============================================================
   CONFIGURACIÓN — ⚠️ EDITA ESTOS VALORES
============================================================ */
const GOOGLE_CLIENT_ID = "790006243316-j8mt9cnbdoqtqenq4m908ls5kaj5murj.apps.googleusercontent.com";

// Dominios permitidos (en minúsculas)
const DOMINIOS_PERMITIDOS = ["apprecio.com", "dcanje.com"];

/* ============================================================
   GOOGLE AUTH
============================================================ */
function iniciarLoginGoogle() {
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: "openid email profile",
    callback: (tokenResponse) => {
      if (tokenResponse.error) return;
      obtenerPerfilUsuario(tokenResponse.access_token);
    }
  });
  client.requestAccessToken();
}

async function obtenerPerfilUsuario(accessToken) {
  const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
    headers: { Authorization: `Bearer ${accessToken}` }
  });
  const perfil = await res.json();
  validarYMostrarApp(perfil);
}

function validarYMostrarApp(perfil) {
  const email = (perfil.email || "").toLowerCase();
  const dominio = email.split("@")[1] || "";

  if (!DOMINIOS_PERMITIDOS.includes(dominio)) {
    document.getElementById("domainError").style.display = "block";
    return;
  }

  // Guardar sesión en sessionStorage
  sessionStorage.setItem("gcUser", JSON.stringify({
    name: perfil.name,
    email: perfil.email,
    picture: perfil.picture
  }));

  mostrarApp(perfil);
}

function mostrarApp(perfil) {
  // Ocultar login
  document.getElementById("loginScreen").style.display = "none";

  // Mostrar barra de sesión
  const bar = document.getElementById("sessionBar");
  bar.style.display = "flex";
  document.getElementById("userAvatar").src = perfil.picture || "";
  document.getElementById("userName").textContent = perfil.name || "";
  document.getElementById("userEmail").textContent = perfil.email || "";

  // Mostrar formulario
  document.getElementById("appScreen").style.display = "block";

  // 🔥 Pre-rellenar correo ejecutivo automáticamente
  document.getElementById("correoEjecutivo").value = perfil.email || "";
}

function cerrarSesion() {
  sessionStorage.removeItem("gcUser");
  location.reload();
}

// Al cargar: revisar si ya hay sesión activa
window.addEventListener("load", () => {
  const saved = sessionStorage.getItem("gcUser");
  if (saved) {
    mostrarApp(JSON.parse(saved));
  }
});

/* ============================================================
   TU CÓDIGO ORIGINAL (sin cambios)
============================================================ */
const API_URL_STOCK   = "https://n8n.openip.cl/webhook/gc-stock";
const API_URL_PEDIDOS = "https://n8n.openip.cl/webhook/gc-pedidos";
const API_URL_EMPRESAS = "https://n8n.openip.cl/webhook/empresas";

let empresasCache = [];
let panelTomSelect = null;

function normKey(k) { return String(k || "").trim().toLowerCase(); }
function getAny(row, keys) {
  const map = {};
  Object.keys(row || {}).forEach(k => map[normKey(k)] = row[k]);
  for (const k of keys) {
    const v = map[normKey(k)];
    if (v !== undefined && v !== null && String(v).trim() !== "") return v;
  }
  return undefined;
}

function limpiarFormularioCompleto() {
  document.querySelectorAll("input").forEach(input => {
    if (input.type !== "button" && input.type !== "submit" &&
        input.type !== "file" && input.type !== "hidden") {
      input.value = "";
    }
  });
  document.querySelectorAll("select").forEach(s => s.selectedIndex = 0);
  document.querySelectorAll("textarea").forEach(t => t.value = "");
  document.getElementById("giftCardFields").innerHTML = "";
  document.getElementById("idPedido").value = "";
  document.getElementById("panelEmpresa").innerHTML = '<option value="">Selecciona empresa</option>';
  document.getElementById("sucursalSelect").innerHTML = '<option value="">Selecciona sucursal</option>';
  empresasCache = [];
}

function habilitarFormulario(estadoEditable) {
  document.querySelectorAll("input, select, textarea").forEach(el => {
    if (el.type === "hidden" || el.name === "modoPedido" || el.name === "tipoEnvio") return;
    if (estadoEditable) {
      el.removeAttribute("readonly");
      el.style.pointerEvents = "";
      el.style.backgroundColor = "";
    } else {
      el.setAttribute("readonly", true);
      if (el.tagName === "SELECT") el.style.pointerEvents = "none";
      el.style.backgroundColor = "#f5f5f5";
    }
  });
}

function activarToggle(groupId, hiddenInputId, callback = null) {
  const group = document.getElementById(groupId);
  const hiddenInput = document.getElementById(hiddenInputId);
  group.querySelectorAll(".toggle-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      group.querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      hiddenInput.value = btn.dataset.value;
      if (callback) callback(btn.dataset.value);
    });
  });
}

activarToggle("envioToggle", "tipoEnvio");
activarToggle("modoPedidoToggle", "modoPedidoHidden", (valor) => {
  const bloque = document.getElementById("bloqueModificar");
  const submitBtn = document.querySelector('button[type="submit"]');
  const addBtn = document.querySelector(".add-button");
  limpiarFormularioCompleto();
  if (valor === "modificar") {
    bloque.classList.remove("hidden");
    habilitarFormulario(true);
    submitBtn.textContent = "Guardar Modificación";
    addBtn.style.display = "block";
  } else if (valor === "anular") {
    bloque.classList.remove("hidden");
    submitBtn.textContent = "Anular Pedido";
    addBtn.style.display = "none";
  } else {
    bloque.classList.add("hidden");
    habilitarFormulario(true);
    submitBtn.textContent = "Enviar pedido";
    addBtn.style.display = "block";
  }
});

function activarBusquedaPanel() {
  if (panelTomSelect) panelTomSelect.destroy();
  panelTomSelect = new TomSelect("#panelEmpresa", {
    create: false,
    sortField: { field: "text", direction: "asc" },
    placeholder: "Escribe para buscar empresa...",
    allowEmptyOption: true
  });
}

async function cargarEmpresasPorPais(pais, empresaSeleccionada = null, sucursalSeleccionada = null) {
  if (!pais) return;
  const res = await fetch(`${API_URL_EMPRESAS}?pais=${encodeURIComponent(pais)}`);
  const data = await res.json();
  empresasCache = data.empresas || [];
  const panelSelect = document.getElementById("panelEmpresa");
  panelSelect.innerHTML = '<option value="">Selecciona empresa</option>';
  empresasCache.forEach(emp => {
    const opt = document.createElement("option");
    opt.value = emp.nombreEmpresa;
    opt.textContent = emp.nombreEmpresa;
    panelSelect.appendChild(opt);
  });
  activarBusquedaPanel();
  if (empresaSeleccionada) {
    panelTomSelect.setValue(empresaSeleccionada);
    const empresa = empresasCache.find(e => e.nombreEmpresa === empresaSeleccionada);
    if (empresa) {
      document.getElementById("razonSocial").value = empresa.razonSocial || "";
      document.getElementById("rutEmpresa").value = empresa.rut || "";
      document.getElementById("idPanelHidden").value = empresa.idPanel ?? "";
      const sucursalSelect = document.getElementById("sucursalSelect");
      sucursalSelect.innerHTML = '<option value="">Selecciona sucursal</option>';
      (empresa.sucursales || []).forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.idSucursal;
        opt.textContent = `${s.nombreSucursal} (${s.idSucursal})`;
        sucursalSelect.appendChild(opt);
      });
      if (sucursalSeleccionada) sucursalSelect.value = sucursalSeleccionada;
    }
  }
}

document.getElementById("pais").addEventListener("change", function () {
  cargarEmpresasPorPais(this.value);
});

document.getElementById("panelEmpresa").addEventListener("change", function () {
  const empresa = empresasCache.find(e => e.nombreEmpresa === this.value);
  if (!empresa) return;
  document.getElementById("razonSocial").value = empresa.razonSocial || "";
  document.getElementById("rutEmpresa").value = empresa.rut || "";
  document.getElementById("idPanelHidden").value = empresa.idPanel ?? "";
  const sucursalSelect = document.getElementById("sucursalSelect");
  sucursalSelect.innerHTML = '<option value="">Selecciona sucursal</option>';
  (empresa.sucursales || []).forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.idSucursal;
    if (String(s.idSucursal) === "0") {
      opt.textContent = "Administrador (0)";
      opt.dataset.nombre = "Administrador";
    } else {
      opt.textContent = `${s.nombreSucursal} (${s.idSucursal})`;
      opt.dataset.nombre = s.nombreSucursal;
    }
    sucursalSelect.appendChild(opt);
  });
});

document.getElementById("sucursalSelect").addEventListener("change", function () {
  const selectedOption = this.options[this.selectedIndex];
  if (!selectedOption) return;
  const nombreSucursal = this.value === "0" ? "Administrador" : (selectedOption.dataset.nombre || "");
  document.getElementById("nombreSucursalHidden").value = nombreSucursal;
});

async function buscarPedido() {
  const idPedido = document.getElementById("idPedido").value;
  if (!idPedido) { alert("Ingresa el ID Pedido"); return; }
  const res = await fetch(`${API_URL_PEDIDOS}?idPedido=${encodeURIComponent(idPedido)}`);
  const payload = await res.json();
  const rows = Array.isArray(payload) ? payload : (payload.rows || payload.data || []);
  if (!rows.length) { alert("No se encontró el pedido."); return; }
  const head = rows[0];
  const paisVal = head["País"] || head["Pais"] || "";
  document.getElementById("pais").value = paisVal;
  await cargarEmpresasPorPais(paisVal, head["Panel Empresa"], head["Sucursal"]);
  document.querySelector('[name="correoEjecutivoApprecio"]').value = head["Correo KAM"] || head["Correo"] || "";
  document.querySelector('[name="razon"]').value = head["Razón Social"] || head["Razon Social"] || "";
  document.querySelector('[name="idTributario"]').value = head["ID Tributario"] || head["Id Tributario"] || "";
  document.querySelector('[name="panel"]').value = head["Panel Empresa"] || "";
  document.querySelector('[name="tipoPago"]').value = head["Tipo de Pago"] || "";
  document.querySelector('[name="oc"]').value = head["OC"] || "";
  document.querySelector('[name="sucursal"]').value = head["Sucursal"] || "";
  document.querySelector('[name="tipoGiftCard"]').value = head["Tipo de Gift card"] || head["Tipo de Gift Card"] || "";
  document.querySelector('[name="descuento"]').value = head["Descuento"] || "";
  document.querySelector('[name="comentarios"]').value = head["Comentarios"] || "";
  document.querySelector('[name="giftCardFisica"]').value = head["GC Fisica"] || "No";
  for (const r of rows) {
    await addGiftCardGroup({
      idInterno: r["ID Interno"] || r["ID interno"] || "",
      giftCard: r["Gift card"] || r["Gift Card"] || "",
      fuente: r["Fuente"] || "Catálogo",
      monto: r["Monto GC"] ?? "",
      cantidad: r["Cantidad GC"] ?? 1
    });
  }
  const modoActual = document.getElementById("modoPedidoHidden").value;
  if (modoActual === "anular") {
    habilitarFormulario(false);
    alert("Pedido cargado. Confirma anulación.");
  } else {
    alert("Pedido cargado. Revisa y ajusta antes de enviar.");
  }
}

async function addGiftCardGroup(prefill = {}) {
  const pais = document.getElementById("pais").value;
  if (!pais) { alert("Selecciona el país primero"); return; }
  const wrapper = document.createElement("div");
  wrapper.className = "gift-card-group";
  wrapper.innerHTML = `
    <button type="button" class="delete-btn">🗑 Eliminar</button>
    <label>Gift Card</label>
    <select class="giftcard-select" name="giftCard[]" required></select>
    <label>ID Interno</label>
    <input class="id-interno-input" name="idInterno[]" readonly />
    <label>Fuente</label>
    <select class="fuente-select" name="fuente[]" required>
      <option>Catálogo</option>
      <option>Proveedor</option>
    </select>
    <label>Monto Gift Card</label>
    <div class="monto-container"></div>
    <label>Stock disponible</label>
    <input class="stock-input" readonly />
    <label>Cantidad</label>
    <input type="number" class="cantidad-input" name="cantidad[]" min="1" required />
    <div class="warning">⚠️ Esta solicitud dejará el stock en 30% o menos.</div>
    <div class="comentario-warning hidden"></div>
  `;
  document.getElementById("giftCardFields").appendChild(wrapper);
  wrapper.querySelector(".delete-btn").addEventListener("click", () => wrapper.remove());

  const gift = wrapper.querySelector(".giftcard-select");
  const montoContainer = wrapper.querySelector(".monto-container");
  const stock = wrapper.querySelector(".stock-input");
  const fuente = wrapper.querySelector(".fuente-select");
  const cantidad = wrapper.querySelector(".cantidad-input");
  const warning = wrapper.querySelector(".warning");
  const idInternoInput = wrapper.querySelector(".id-interno-input");

  if (idInternoInput) idInternoInput.value = prefill.idInterno ? String(prefill.idInterno) : "";

  const modo = document.getElementById("modoPedidoHidden")?.value;
  const idPedidoActual = document.getElementById("idPedido")?.value;
  if (modo === "modificar" && idPedidoActual && !idInternoInput.value) {
    const existentes = Array.from(document.querySelectorAll('input[name="idInterno[]"]')).filter(i => i.value);
    idInternoInput.value = `${idPedidoActual}_${existentes.length + 1}`;
  }

  await cargarGiftCards(gift);
  if (prefill.giftCard) {
    const exists = Array.from(gift.options).some(o => o.value === prefill.giftCard || o.textContent === prefill.giftCard);
    if (!exists) {
      const o = document.createElement("option");
      o.value = prefill.giftCard; o.textContent = prefill.giftCard;
      gift.appendChild(o);
    }
    gift.value = prefill.giftCard;
  }
  if (prefill.fuente) fuente.value = prefill.fuente;
  if (prefill.cantidad) cantidad.value = Number(prefill.cantidad);

  gift.addEventListener("change", async e => {
    if (fuente.value === "Catálogo") await cargarMontos(montoContainer, stock, e.target.value);
  });
  fuente.addEventListener("change", async () => {
    stock.value = ""; stock.dataset.original = ""; warning.style.display = "none";
    if (fuente.value === "Proveedor") {
      montoContainer.innerHTML = `<input type="number" name="monto[]" placeholder="Ingresa monto libre" required />`;
      if (prefill.monto !== undefined && prefill.monto !== null && prefill.monto !== "") {
        montoContainer.querySelector("input").value = Number(prefill.monto);
      }
    } else {
      montoContainer.innerHTML = `<select class="monto-select" name="monto[]" required></select>`;
      if (gift.value) {
        await cargarMontos(montoContainer, stock, gift.value);
        if (prefill.monto !== undefined && prefill.monto !== null && prefill.monto !== "") {
          const sel = montoContainer.querySelector("select");
          sel.value = String(Number(prefill.monto));
          sel.dispatchEvent(new Event("change"));
        }
      }
    }
  });
  cantidad.addEventListener("input", () => {
    if (fuente.value !== "Catálogo") return;
    const original = Number(stock.dataset.original);
    const cant = Number(cantidad.value);
    if (!original || !cant) { warning.style.display = "none"; return; }
    warning.style.display = (original - cant) / original <= 0.3 ? "block" : "none";
  });
  fuente.dispatchEvent(new Event("change"));
}

async function cargarGiftCards(select) {
  const pais = document.getElementById("pais").value;
  const res = await fetch(`${API_URL_STOCK}?pais=${encodeURIComponent(pais)}`);
  const data = await res.json();
  select.innerHTML = `<option value="">Selecciona</option>` +
    (data.giftCards || []).map(g => `<option value="${String(g)}">${String(g)}</option>`).join('');
}

async function cargarMontos(container, stock, giftCard) {
  container.innerHTML = `<select class="monto-select" name="monto[]" required></select>`;
  const select = container.querySelector("select");
  const wrapper = container.closest(".gift-card-group");
  const comentarioBox = wrapper.querySelector(".comentario-warning");
  const pais = document.getElementById("pais").value;
  const res = await fetch(`${API_URL_STOCK}?pais=${encodeURIComponent(pais)}&giftCard=${encodeURIComponent(giftCard)}`);
  const data = await res.json();
  select.innerHTML = `<option value="">Selecciona monto</option>`;
  let comentarioMostrado = null;
  (data.montos || []).forEach(m => {
    const o = document.createElement("option");
    o.value = String(m.monto);
    o.dataset.stock = String(m.stock);
    o.textContent = `${Number(m.monto).toLocaleString()} (stock: ${m.stock})`;
    select.appendChild(o);
    if (m.comentario && !comentarioMostrado) comentarioMostrado = m.comentario;
  });
  if (comentarioMostrado) {
    comentarioBox.classList.remove("hidden");
    comentarioBox.innerHTML = `ℹ️ ${comentarioMostrado}`;
  } else {
    comentarioBox.classList.add("hidden");
    comentarioBox.innerHTML = "";
  }
  select.addEventListener("change", e => {
    const opt = e.target.selectedOptions[0];
    const s = opt ? Number(opt.dataset.stock) : 0;
    stock.value = s;
    stock.dataset.original = s;
  });
}

document.getElementById("bulkUpload").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async evt => {
    const wb = XLSX.read(evt.target.result, { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    for (const r of rows) {
      await addGiftCardGroup({
        giftCard: getAny(r, ["Gift card","Gift Card","gift card","Giftcard","Nombre gift card"]),
        fuente: getAny(r, ["Fuente","fuente"]) || "Catálogo",
        monto: getAny(r, ["Monto","monto","monto gc"]),
        cantidad: getAny(r, ["Cantidad","cantidad"]) || 1
      });
    }
  };
  reader.readAsArrayBuffer(file);
});

document.getElementById("pais").addEventListener("change", () => {
  document.getElementById("giftCardFields").innerHTML = "";
});
</script>
