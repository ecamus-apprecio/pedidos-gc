<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Pedido Gift Cards</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body {
  font-family: 'Montserrat', sans-serif;
  background-color: #f9f9f9;
  padding: 40px 0;
}
.container {
  max-width: 700px;
  background: #fff;
  margin: auto;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(0,0,0,.1);
}
h1 { color: #fa345e; text-align:center; }
label { display:block; margin:14px 0 6px; font-weight:600; }
input, select, textarea {
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
}
button {
  background:#fa345e;
  color:white;
  border:none;
  padding:12px;
  border-radius:8px;
  margin-top:20px;
  cursor:pointer;
}
.gift-card-group {
  border:1px solid #eee;
  padding:20px;
  margin-top:20px;
  border-radius:10px;
  background:#fafafa;
}
.hidden { display:none; }
</style>
</head>

<body>
<div class="container">

<h1>Pedido Gift Cards</h1>

<form method="POST" enctype="multipart/form-data"
      action="https://n8n.openip.cl/webhook/pedidosgc">

<!-- =========================
     TIPO DE OPERACIÓN
========================= -->

<label>Tipo de operación</label>
<select id="tipoOperacion" required>
  <option value="nuevo">Nuevo Pedido</option>
  <option value="modificar">Modificar Pedido</option>
</select>

<div id="bloqueIdPedido" class="hidden">
  <label>ID Pedido</label>
  <input id="idPedido" name="idPedido" />
  <button type="button" onclick="buscarPedido()">Buscar Pedido</button>
</div>

<hr>

<!-- =========================
     PRIMER CAMPO
========================= -->

<label>Correo Ejecutivo Apprecio</label>
<input type="email" name="correoEjecutivoApprecio" required />

<label>País</label>
<select id="pais" name="pais" required>
  <option value="">Selecciona</option>
  <option>Chile</option>
  <option>Colombia</option>
  <option>Perú</option>
  <option>México</option>
</select>

<label>Razón Social</label>
<input name="razon" required />

<label>ID Tributario</label>
<input name="idTributario" required />

<label>Panel</label>
<input name="panel" required />

<label>Tipo de Pago</label>
<select name="tipoPago" required>
  <option value="">Selecciona</option>
  <option>Crédito</option>
  <option>Contado</option>
</select>

<label>OC</label>
<input name="oc" required />

<label>Sucursal</label>
<input name="sucursal" />

<label>Tipo de Gift Card</label>
<select name="tipoGiftCard" required>
  <option value="">Selecciona</option>
  <option value="PDF">Gift card PDF</option>
  <option value="Delivery">Gift card Delivery</option>
</select>

<!-- NUEVO CAMPO -->
<label>Gift Card Física</label>
<select name="giftCardFisica">
  <option value="No" selected>No</option>
  <option value="Si">Si</option>
</select>

<label>Descuento (%)</label>
<input name="descuento" />

<label>Comentarios</label>
<textarea name="comentarios"></textarea>

<hr>

<div id="giftCardFields"></div>

<button type="button" onclick="addGiftCardGroup()">
➕ Agregar Gift Card
</button>

<button type="submit">Enviar Pedido</button>

</form>
</div>

<script>

const API_STOCK = "https://n8n.openip.cl/webhook/gc-stock";
const API_PEDIDOS = "https://n8n.openip.cl/webhook/gc-pedidos";

/* =========================
   NUEVO / MODIFICAR
========================= */

document.getElementById("tipoOperacion").addEventListener("change", e => {
  const bloque = document.getElementById("bloqueIdPedido");
  if (e.target.value === "modificar") {
    bloque.classList.remove("hidden");
  } else {
    bloque.classList.add("hidden");
  }
});

/* =========================
   BUSCAR PEDIDO
========================= */

async function buscarPedido() {
  const idPedido = document.getElementById("idPedido").value;
  if (!idPedido) return alert("Ingresa ID Pedido");

  const res = await fetch(`${API_PEDIDOS}?idPedido=${idPedido}`);
  const data = await res.json();

  if (!data || !data.length) {
    alert("Pedido no encontrado");
    return;
  }

  const cabecera = data[0];

  document.querySelector('[name="correoEjecutivoApprecio"]').value = cabecera["Correo KAM"] || "";
  document.querySelector('[name="pais"]').value = cabecera["País"] || "";
  document.querySelector('[name="razon"]').value = cabecera["Razón Social"] || "";
  document.querySelector('[name="idTributario"]').value = cabecera["ID Tributario"] || "";
  document.querySelector('[name="panel"]').value = cabecera["Panel"] || "";
  document.querySelector('[name="tipoPago"]').value = cabecera["Tipo de Pago"] || "";
  document.querySelector('[name="oc"]').value = cabecera["OC"] || "";
  document.querySelector('[name="sucursal"]').value = cabecera["Sucursal"] || "";
  document.querySelector('[name="tipoGiftCard"]').value = cabecera["Tipo de Gift card"] || "";
  document.querySelector('[name="descuento"]').value = cabecera["Descuento"] || "";
  document.querySelector('[name="comentarios"]').value = cabecera["Comentarios"] || "";

  document.getElementById("giftCardFields").innerHTML = "";

  data.forEach(row => {
    addGiftCardGroup({
      giftCard: row["Gift card"],
      fuente: row["Fuente"],
      monto: row["Monto"],
      cantidad: row["Cantidad"]
    });
  });
}

/* =========================
   BLOQUE GIFT CARD
========================= */

async function addGiftCardGroup(prefill = {}) {

  const wrapper = document.createElement("div");
  wrapper.className = "gift-card-group";
  wrapper.innerHTML = `
    <label>Gift Card</label>
    <input name="giftCard[]" value="${prefill.giftCard || ''}" required>

    <label>Fuente</label>
    <select name="fuente[]">
      <option ${prefill.fuente === "Catálogo" ? "selected":""}>Catálogo</option>
      <option ${prefill.fuente === "Proveedor" ? "selected":""}>Proveedor</option>
    </select>

    <label>Monto</label>
    <input name="monto[]" type="number" value="${prefill.monto || ''}" required>

    <label>Cantidad</label>
    <input name="cantidad[]" type="number" value="${prefill.cantidad || ''}" required>
  `;

  document.getElementById("giftCardFields").appendChild(wrapper);
}

</script>
</body>
</html>
