<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Pedido Gift Cards</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  
<link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>


<style>
body {
  font-family: 'Montserrat', sans-serif;
  background-color: #f9f9f9;
  padding: 40px 0;
}
.container {
  max-width: 650px;
  background: #fff;
  margin: auto;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(0,0,0,.1);
}
.logo {
  display: block;
  margin: 0 auto 20px;
  max-width: 180px;
}
h1 {
  color: #fa345e;
  text-align: center;
  margin-bottom: 30px;
}
label {
  display: block;
  margin: 16px 0 6px;
  font-weight: 600;
}
input, select, textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 14px;
}
select { background-color: #fef2f3; }
textarea {
  resize: vertical;
  min-height: 80px;
}
button {
  background-color: #fa345e;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 20px;
}
.gift-card-group {
  border: 1px solid #eee;
  padding: 20px;
  border-radius: 10px;
  margin-top: 20px;
  background: #fefefe;
}
.add-button {
  background-color: #f8848f;
  width: 100%;
}
.warning {
  margin-top: 8px;
  padding: 10px;
  background: #fff3cd;
  border: 1px solid #ffeeba;
  color: #856404;
  border-radius: 6px;
  font-size: 13px;
  display: none;
}
.hidden { display:none; }
.inline-row {
  display:flex;
  gap:10px;
  align-items:flex-end;
}
.inline-row > div { flex:1; }
.small-btn {
  margin-top: 0;
  padding: 10px 14px;
  font-size: 14px;
  white-space: nowrap;
}
.hr { margin: 22px 0; border: none; border-top: 1px solid #eee; }
  .top-options {
  display: flex;
  gap: 20px;
  margin-bottom: 30px;
}

.option-group {
  flex: 1;
}

.toggle-group {
  display: flex;
  gap: 10px;
}

.toggle-btn {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #fa345e;
  background: white;
  color: #fa345e;
  cursor: pointer;
  font-weight: 600;
  transition: 0.2s ease;
}

.toggle-btn.active {
  background: #fa345e;
  color: white;
}

</style>
</head>

<body>
<div class="container">
<img src="https://estudios.apprecio.com/hubfs/logos/Apprecio-logo-rojo.png" class="logo" />
<h1>Pedido Gift Cards</h1>

<form method="POST" enctype="multipart/form-data"
      action="https://n8n.openip.cl/webhook/pedidosgc">

<!-- =========================
     3) NUEVO: NUEVO / MODIFICAR
========================= -->
<label>Tipo de solicitud</label>

<div id="bloqueModificar" class="hidden">
  <div class="inline-row">
    <div>
      <label>ID Pedido</label>
      <input id="idPedido" name="idPedido" placeholder="Ej: 123" />
    </div>
    <div>
      <button type="button" class="small-btn" onclick="buscarPedido()">Buscar</button>
    </div>
  </div>
</div>
  <div class="top-options">

  <!-- ENVÍO -->
  <div class="option-group">
    <label>Envío</label>
    <div class="toggle-group" id="envioToggle">
      <button type="button" class="toggle-btn active" data-value="Facturacion">
        Facturación
      </button>
      <button type="button" class="toggle-btn" data-value="Operaciones">
        Operaciones
      </button>
    </div>
    <input type="hidden" name="tipoEnvio" id="tipoEnvio" value="Facturacion">
  </div>

  <!-- TIPO PEDIDO -->
  <div class="option-group">
    <label>Tipo de pedido</label>
    <div class="toggle-group" id="modoPedidoToggle">
      <button type="button" class="toggle-btn active" data-value="nuevo">
        Nuevo
      </button>
      <button type="button" class="toggle-btn" data-value="modificar">
        Modificar
      </button>
    </div>
    <input type="hidden" name="modoPedido" id="modoPedidoHidden" value="nuevo">
  </div>

</div>


<!-- =========================
     1) PRIMER CAMPO: CORREO EJECUTIVO
========================= -->
<label>Correo Ejecutivo Apprecio</label>
<input type="email" name="correoEjecutivoApprecio" required />

<label>País</label>
<select id="pais" name="pais" required>
  <option value="">Selecciona</option>
  <option>Chile</option>
  <option>Colombia</option>
  <option>Perú</option>
  <option>México</option>
</select>

<label>Panel Empresa</label>
<select id="panelEmpresa" name="panel" required>
  <option value="">Selecciona empresa</option>
</select>

<label>Razón Social</label>
<input name="razon" id="razonSocial" readonly required />

<label>ID Tributario</label>
<input name="idTributario" id="rutEmpresa" readonly required />

  <label>Sucursal</label>
<select name="sucursal" id="sucursalSelect">
  <option value="">Selecciona sucursal</option>
</select>

<label>Tipo de Pago</label>
<select name="tipoPago" required>
  <option value="">Selecciona</option>
  <option>Crédito</option>
  <option>Contado</option>
</select>

<label>OC</label>
<input name="oc" required />

<label>Tipo de Gift Card</label>
<select name="tipoGiftCard" required>
  <option value="">Selecciona</option>
  <option value="PDF">Gift card PDF</option>
  <option value="Delivery">Gift card Delivery</option>
</select>

<!-- =========================
     2) NUEVO: GIFT CARD FÍSICA
========================= -->
<label>Gift Card física</label>
<select name="giftCardFisica" required>
  <option value="No" selected>No</option>
  <option value="Si">Si</option>
</select>

<label>Descuento (%)</label>
<input name="descuento" />

<label>Comentarios</label>
<textarea name="comentarios"></textarea>

<hr class="hr">

<label>Carga masiva (Excel / CSV)</label>
<input type="file" id="bulkUpload" accept=".xlsx,.csv" />

<div id="giftCardFields"></div>

<button type="button" class="add-button" onclick="addGiftCardGroup()">
➕ Agregar Gift Card manual
</button>

<!-- SE MANTIENE: MÚLTIPLES ARCHIVOS -->
<label>Adjuntar archivos</label>
<input type="file" name="adjunto[]" multiple />

<button type="submit">Enviar pedido</button>
</form>
</div>

<script>
const API_URL_STOCK = "https://n8n.openip.cl/webhook/gc-stock";
const API_URL_PEDIDOS = "https://n8n.openip.cl/webhook/gc-pedidos";
const API_URL_EMPRESAS = "https://n8n.openip.cl/webhook/empresas";

let empresasCache = [];
let panelTomSelect = null;



/* =========================
   HELPERS (mapeo carga masiva)
========================= */
function normKey(k) {
  return String(k || "").trim().toLowerCase();
}
function getAny(row, keys) {
  const map = {};
  Object.keys(row || {}).forEach(k => map[normKey(k)] = row[k]);
  for (const k of keys) {
    const v = map[normKey(k)];
    if (v !== undefined && v !== null && String(v).trim() !== "") return v;
  }
  return undefined;
}

function limpiarFormularioCompleto() {

  // 1️⃣ Limpiar inputs tipo texto, email, number
  document.querySelectorAll("input").forEach(input => {
    if (input.type !== "button" && input.type !== "submit" && input.type !== "file") {
      input.value = "";
    }
  });

  // 2️⃣ Resetear selects
  document.querySelectorAll("select").forEach(select => {
    select.selectedIndex = 0;
  });

  // 3️⃣ Resetear textarea
  document.querySelectorAll("textarea").forEach(t => {
    t.value = "";
  });

  // 4️⃣ Limpiar gift cards dinámicas
  document.getElementById("giftCardFields").innerHTML = "";

  // 5️⃣ Limpiar ID Pedido
  document.getElementById("idPedido").value = "";

  // 6️⃣ Volver modo a Nuevo
  // Resetear botones toggle a Nuevo
document.getElementById("modoPedidoHidden").value = "nuevo";

const botonesModo = document.querySelectorAll("#modoPedidoToggle .toggle-btn");
botonesModo.forEach(b => b.classList.remove("active"));
botonesModo[0].classList.add("active");

    // Limpiar dropdown empresas
  document.getElementById("panelEmpresa").innerHTML =
    '<option value="">Selecciona empresa</option>';

  // Limpiar dropdown sucursales
  document.getElementById("sucursalSelect").innerHTML =
    '<option value="">Selecciona sucursal</option>';

  // Limpiar cache
  empresasCache = [];

}

  /* =========================
   TOGGLES SUPERIORES
========================= */

function activarToggle(groupId, hiddenInputId, callback = null) {
  const group = document.getElementById(groupId);
  const hiddenInput = document.getElementById(hiddenInputId);

  group.querySelectorAll(".toggle-btn").forEach(btn => {
    btn.addEventListener("click", () => {

      // Quitar active a todos
      group.querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("active"));

      // Activar actual
      btn.classList.add("active");

      // Guardar valor
      hiddenInput.value = btn.dataset.value;

      // Callback opcional (para modificar pedido)
      if (callback) callback(btn.dataset.value);
    });
  });
}

// ENVÍO
activarToggle("envioToggle", "tipoEnvio");

// TIPO PEDIDO
activarToggle("modoPedidoToggle", "modoPedidoHidden", (valor) => {

  const bloque = document.getElementById("bloqueModificar");

  if (valor === "modificar") {
    bloque.classList.remove("hidden");
  } else {
    bloque.classList.add("hidden");
    limpiarFormularioCompleto();
  }

});

  /* =========================
   ACTIVAR BUSCADOR PANEL EMPRESA
========================= */
function activarBusquedaPanel() {

  if (panelTomSelect) {
    panelTomSelect.destroy();
  }

  panelTomSelect = new TomSelect("#panelEmpresa", {
    create: false,
    sortField: {
      field: "text",
      direction: "asc"
    },
    placeholder: "Escribe para buscar empresa...",
    allowEmptyOption: true
  });
}

  /* =========================
   EMPRESAS DINÁMICAS POR PAÍS
========================= */

document.getElementById("pais").addEventListener("change", async function () {

  const pais = this.value;

  // Mantener limpieza de gift cards existente
  document.getElementById("giftCardFields").innerHTML = "";

  if (!pais) return;

  const res = await fetch(`${API_URL_EMPRESAS}?pais=${encodeURIComponent(pais)}`);
  const data = await res.json();

  empresasCache = data.empresas || [];

  const panelSelect = document.getElementById("panelEmpresa");
  panelSelect.innerHTML = '<option value="">Selecciona empresa</option>';

  empresasCache.forEach(emp => {
    const opt = document.createElement("option");
    opt.value = emp.nombreEmpresa;
    opt.textContent = emp.nombreEmpresa;
    panelSelect.appendChild(opt);
  });

  // 🔹 Activar buscador
activarBusquedaPanel();

  // Limpiar dependientes
  document.getElementById("razonSocial").value = "";
  document.getElementById("rutEmpresa").value = "";
  document.getElementById("sucursalSelect").innerHTML =
    '<option value="">Selecciona sucursal</option>';
});


/* =========================
   AL SELECCIONAR EMPRESA
========================= */

document.getElementById("panelEmpresa").addEventListener("change", function () {

  const empresa = empresasCache.find(e => e.nombreEmpresa === this.value);
  if (!empresa) return;

  document.getElementById("razonSocial").value = empresa.razonSocial || "";
  document.getElementById("rutEmpresa").value = empresa.rut || "";

  const sucursalSelect = document.getElementById("sucursalSelect");
  sucursalSelect.innerHTML = '<option value="">Selecciona sucursal</option>';

  (empresa.sucursales || []).forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.idSucursal;
    opt.textContent = `${s.nombreSucursal} (${s.idSucursal})`;
    sucursalSelect.appendChild(opt);
  });

});


/* =========================
   BUSCAR PEDIDO (MODIFICAR)
   - Trae filas por ID Pedido
   - Rellena cabecera
   - Crea múltiples gift cards
========================= */
async function buscarPedido() {
  const idPedido = document.getElementById("idPedido").value;
  if (!idPedido) {
    alert("Ingresa el ID Pedido");
    return;
  }

  const res = await fetch(`${API_URL_PEDIDOS}?idPedido=${encodeURIComponent(idPedido)}`);
  const payload = await res.json();

  // Soporta payload como array o como {rows:[]}
  const rows = Array.isArray(payload) ? payload : (payload.rows || payload.data || []);

  if (!rows.length) {
    alert("Notas: no se encontró el pedido.");
    return;
  }

  // Cabecera = primera fila
  const head = rows[0];

  // Setear País primero (esto limpia gift cards por el listener)
  const paisVal = head["País"] || head["Pais"] || "";
  document.getElementById("pais").value = paisVal;
  document.getElementById("pais").dispatchEvent(new Event("change"));

  // Rellenar campos cabecera
  document.querySelector('[name="correoEjecutivoApprecio"]').value = head["Correo KAM"] || head["Correo"] || "";
  document.querySelector('[name="razon"]').value = head["Razón Social"] || head["Razon Social"] || "";
  document.querySelector('[name="idTributario"]').value = head["ID Tributario"] || head["ID tributario"] || head["Id Tributario"] || "";
  document.querySelector('[name="panel"]').value = head["Panel Empresa"] || "";
  document.querySelector('[name="tipoPago"]').value = head["Tipo de Pago"] || "";
  document.querySelector('[name="oc"]').value = head["OC"] || "";
  document.querySelector('[name="sucursal"]').value = head["Sucursal"] || "";
  document.querySelector('[name="tipoGiftCard"]').value = head["Tipo de Gift card"] || head["Tipo de Gift Card"] || "";
  document.querySelector('[name="descuento"]').value = head["Descuento"] || "";
  document.querySelector('[name="comentarios"]').value = head["Comentarios"] || "";
  document.querySelector('[name="giftCardFisica"]').value = head["GC Fisica"] || "No";

  // Cargar gift cards desde filas (un ID Pedido puede tener varias)
  for (const r of rows) {
    await addGiftCardGroup({
      giftCard: r["Gift card"] || r["Gift Card"] || "",
      fuente: r["Fuente"] || "Catálogo",
      monto: r["Monto GC"] ?? "",
      cantidad: r["Cantidad GC"] ?? 1
    });
  }

  alert("Pedido cargado. Revisa y ajusta antes de enviar.");
}

/* =========================
   CREAR BLOQUE INDIVIDUAL
   (mantiene: gift card por país, montos, stock, warning)
========================= */
async function addGiftCardGroup(prefill = {}) {
  const pais = document.getElementById("pais").value;
  if (!pais) {
    alert("Selecciona el país primero");
    return;
  }

  const wrapper = document.createElement("div");
  wrapper.className = "gift-card-group";
  wrapper.innerHTML = `
    <label>Gift Card</label>
    <select class="giftcard-select" name="giftCard[]" required></select>

    <label>Fuente</label>
    <select class="fuente-select" name="fuente[]" required>
      <option>Catálogo</option>
      <option>Proveedor</option>
    </select>

    <label>Monto Gift Card</label>
    <div class="monto-container"></div>

    <label>Stock disponible</label>
    <input class="stock-input" readonly />

    <label>Cantidad</label>
    <input type="number" class="cantidad-input" name="cantidad[]" min="1" required />

    <div class="warning">
      ⚠️ Esta solicitud dejará el stock en 30% o menos.
    </div>
  `;

  document.getElementById("giftCardFields").appendChild(wrapper);

  const gift = wrapper.querySelector(".giftcard-select");
  const montoContainer = wrapper.querySelector(".monto-container");
  const stock = wrapper.querySelector(".stock-input");
  const fuente = wrapper.querySelector(".fuente-select");
  const cantidad = wrapper.querySelector(".cantidad-input");
  const warning = wrapper.querySelector(".warning");

  // 1) Cargar gift cards por país
  await cargarGiftCards(gift);

  // Prefill GiftCard si viene
  if (prefill.giftCard) {
    // Si el valor existe en options, lo selecciona; si no, lo agrega.
    const exists = Array.from(gift.options).some(o => o.value === prefill.giftCard || o.textContent === prefill.giftCard);
    if (!exists) {
      const o = document.createElement("option");
      o.value = prefill.giftCard;
      o.textContent = prefill.giftCard;
      gift.appendChild(o);
    }
    gift.value = prefill.giftCard;
  }

  // Prefill fuente
  if (prefill.fuente) fuente.value = prefill.fuente;

  // Prefill cantidad
  if (prefill.cantidad) cantidad.value = Number(prefill.cantidad);

  // Listeners
  gift.addEventListener("change", async e => {
    if (fuente.value === "Catálogo") {
      await cargarMontos(montoContainer, stock, e.target.value);
    }
  });

  fuente.addEventListener("change", async () => {
    stock.value = "";
    stock.dataset.original = "";
    warning.style.display = "none";

    if (fuente.value === "Proveedor") {
      montoContainer.innerHTML = `
        <input type="number" name="monto[]" placeholder="Ingresa monto libre" required />
      `;
      // Prefill monto proveedor
      if (prefill.monto !== undefined && prefill.monto !== null && prefill.monto !== "") {
        const inp = montoContainer.querySelector("input");
        inp.value = Number(prefill.monto);
      }
    } else {
      montoContainer.innerHTML = `<select class="monto-select" name="monto[]" required></select>`;
      if (gift.value) {
        await cargarMontos(montoContainer, stock, gift.value);

        // Prefill monto catálogo: seleccionar opción
        if (prefill.monto !== undefined && prefill.monto !== null && prefill.monto !== "") {
          const sel = montoContainer.querySelector("select");
          sel.value = String(Number(prefill.monto));
          sel.dispatchEvent(new Event("change"));
        }
      }
    }
  });

  cantidad.addEventListener("input", () => {
    if (fuente.value !== "Catálogo") return;

    const original = Number(stock.dataset.original);
    const cant = Number(cantidad.value);
    if (!original || !cant) {
      warning.style.display = "none";
      return;
    }

    if ((original - cant) / original <= 0.3) {
      warning.style.display = "block";
    } else {
      warning.style.display = "none";
    }
  });

  // disparar para montar input/select monto correcto
  fuente.dispatchEvent(new Event("change"));
}

/* =========================
   API STOCK (idéntico a tu lógica)
========================= */
async function cargarGiftCards(select) {
  const pais = document.getElementById("pais").value;
  const res = await fetch(`${API_URL_STOCK}?pais=${encodeURIComponent(pais)}`);
  const data = await res.json();

  select.innerHTML = `<option value="">Selecciona</option>` +
    (data.giftCards || []).map(g => `<option value="${String(g)}">${String(g)}</option>`).join('');
}

async function cargarMontos(container, stock, giftCard) {
  container.innerHTML = `<select class="monto-select" name="monto[]" required></select>`;
  const select = container.querySelector("select");

  const pais = document.getElementById("pais").value;
  const res = await fetch(`${API_URL_STOCK}?pais=${encodeURIComponent(pais)}&giftCard=${encodeURIComponent(giftCard)}`);
  const data = await res.json();

  select.innerHTML = `<option value="">Selecciona monto</option>`;
  (data.montos || []).forEach(m => {
    const o = document.createElement("option");
    o.value = String(m.monto);
    o.dataset.stock = String(m.stock);
    o.textContent = `${Number(m.monto).toLocaleString()} (stock: ${m.stock})`;
    select.appendChild(o);
  });

  select.addEventListener("change", e => {
    const opt = e.target.selectedOptions[0];
    const s = opt ? Number(opt.dataset.stock) : 0;
    stock.value = s;
    stock.dataset.original = s;
  });
}

/* =========================
   CARGA MASIVA (se mantiene)
   - Soporta headers típicos:
     Gift card, Fuente, Monto, Cantidad
========================= */
document.getElementById("bulkUpload").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async evt => {
    const wb = XLSX.read(evt.target.result, { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

    for (const r of rows) {
      const prefill = {
        giftCard: getAny(r, ["Gift card", "Gift Card", "gift card", "Giftcard", "Nombre gift card"]),
        fuente: getAny(r, ["Fuente", "fuente"]) || "Catálogo",
        monto: getAny(r, ["Monto", "monto", "monto gc"]),
        cantidad: getAny(r, ["Cantidad", "cantidad"]) || 1
      };
      await addGiftCardGroup(prefill);
    }
  };
  reader.readAsArrayBuffer(file);
});

/* =========================
   LIMPIAR BLOQUES SI CAMBIA PAÍS
========================= */
document.getElementById("pais").addEventListener("change", () => {
  document.getElementById("giftCardFields").innerHTML = "";
});
</script>
</body>
</html>
